<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Chat with Sentinel, a read-only crypto portfolio risk agent.">
    <title>Sentinel — Portfolio Risk Agent</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="chat-shell">
      <header class="chat-header">
        <div class="header-grid content-grid">
          <a class="wordmark" href="/" aria-label="Sentinel home">SENTINEL</a>
          <div class="model-picker">
            <button
              id="model-trigger"
              class="model-trigger"
              type="button"
              aria-expanded="false"
              aria-controls="model-menu"
              disabled
            >
              <span id="active-model">Loading model…</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <div id="model-menu" class="model-menu" role="menu" hidden></div>
          </div>
        </div>
      </header>

      <ol id="chat-thread" class="chat-thread content-grid" aria-label="Conversation">
        <li class="turn assistant-turn welcome-turn">
          <div class="speaker">Sentinel</div>
          <div class="turn-content">
            <p>I can inspect your Binance Demo portfolio, apply your policy, and explain the risk. I cannot execute trades.</p>
          </div>
        </li>
      </ol>

      <form id="chat-composer" class="composer-wrap" novalidate>
        <div class="composer content-grid">
          <label class="sr-only" for="prompt">Message Sentinel</label>
          <textarea
            id="prompt"
            name="prompt"
            rows="1"
            maxlength="8000"
            placeholder="Ask Sentinel about your portfolio…"
            aria-describedby="prompt-error"
          ></textarea>
          <button id="send-button" type="submit">Send</button>
        </div>
        <p id="prompt-error" class="composer-error content-grid" role="alert" hidden>Enter a message first.</p>
        <p class="read-only-note content-grid">Read-only analysis · Binance Demo data · No execution tools</p>
      </form>
    </main>
    <p id="live-status" class="sr-only" aria-live="polite"></p>
  </body>
</html>
